<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Service - แจ้งซ่อมออนไลน์</title>
  <meta name="description" content="ระบบแจ้งซ่อมอุปกรณ์ทางการแพทย์ออนไลน์ (Smart Service - Callcenter IIS)">
  <meta property="og:title" content="Smart Service - แจ้งซ่อมออนไลน์">
  <meta property="og:description" content="ระบบแจ้งซ่อมอุปกรณ์ทางการแพทย์ออนไลน์ (Smart Service - Callcenter IIS)">
  <link rel="icon" type="image/jpeg" href="/assets/aistudio/IIS_af19d8da.jpg">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #f4f7f6;
      color: #333;
    }
    .service-card {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      padding: 2rem;
      margin-top: 2rem;
      margin-bottom: 2rem;
      border-top: 5px solid #0d6efd;
    }
    .service-header {
      text-align: center;
      padding-bottom: 1.25rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #e9ecef;
    }
    .brand-logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #ffffff;
      padding: 4px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      margin-bottom: 0.9rem;
    }
    .brand-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }
    .brand-subtitle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #6c757d;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }
    .header-title {
      font-weight: 600;
      color: #0d6efd;
      margin-bottom: 0;
    }
    .form-label {
      font-weight: 500;
    }
    .input-group-text {
      background-color: #f8f9fa;
      border-right: none;
    }
    .form-control, .form-select {
      border-left: none;
    }
    .form-control:focus, .form-select:focus {
      border-color: #ced4da;
      box-shadow: none;
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: 500;
      border-radius: 8px;
    }
    #loadingOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.8);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loadingOverlay">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    <h5 class="mt-3 text-primary">กำลังดำเนินการ...</h5>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="service-card">
          <div class="service-header">
            <div class="brand-logo-wrap">
              <img src="/assets/aistudio/IIS_af19d8da.jpg" alt="IIS Logo" class="brand-logo">
            </div>
            <div>
              <span class="brand-subtitle">
                <i class="fa-solid fa-screwdriver-wrench text-primary"></i>
                Smart Service
              </span>
            </div>
            <h3 class="header-title">ระบบแจ้งซ่อมออนไลน์</h3>
          </div>
          
          <form id="repairForm" onsubmit="handleFormSubmit(event)">
            
            <div class="mb-3">
              <label class="form-label">โรงพยาบาล (Hospital)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-hospital"></i></span>
                <input type="text" class="form-control" id="hospital" name="hospital" required placeholder="ระบุชื่อโรงพยาบาล">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">ชื่อผู้ติดต่อ (Contact Name)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                <input type="text" class="form-control" id="contactName" name="contactName" required placeholder="ชื่อ-นามสกุล">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">เบอร์โทรติดต่อ (Phone)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                <input type="tel" class="form-control" id="contactPhone" name="contactPhone" required placeholder="08X-XXX-XXXX">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">ชื่อรุ่น/อุปกรณ์ (Equipment)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-laptop-medical"></i></span>
                <input type="text" class="form-control" id="equipment" name="equipment" required placeholder="ระบุชื่อรุ่น/อุปกรณ์">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">หมายเลขเครื่อง (Serial Number)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-barcode"></i></span>
                <input type="text" class="form-control" id="serialNumber" name="serialNumber" required placeholder="หมายเลขเครื่อง">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">วันที่ติดตั้ง (IB Date)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-calendar-day"></i></span>
                <input type="text" class="form-control" id="ibdate" name="ibdate" placeholder="วันที่ติดตั้ง">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">วันที่หมดประกัน (Expiry Date)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-calendar-day"></i></span>
                <input type="text" class="form-control" id="expirydate" name="expirydate" placeholder="วันที่หมดประกัน">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">อาการเสียเบื้องต้น (Problem)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-circle-exclamation"></i></span>
                <textarea class="form-control" id="problem" name="problem" rows="3" required placeholder="อธิบายอาการที่พบ"></textarea>
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label">วันที่แจ้ง (Report Date)</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-calendar-day"></i></span>
                <input type="date" class="form-control" id="reportDate" name="reportDate" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">วิศวกรที่รับผิดชอบ (Engineer) - ตัวเลือก</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-helmet-safety"></i></span>
                <input type="text" class="form-control" id="engineer" name="engineer" placeholder="หากทราบสามารถระบุได้ (เว้นว่างได้)">
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label">แนบรูปภาพประกอบ (Image)</label>
              <input class="form-control" type="file" id="imageFile" accept="image/*">
              <small class="text-muted">รองรับไฟล์รูปภาพเท่านั้น</small>
            </div>

            <button type="submit" class="btn btn-primary btn-submit">
              <i class="fa-solid fa-paper-plane me-2"></i> ยืนยันการแจ้งซ่อม
            </button>

          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <script>
    // ใส่ URL Web App (/exec) ของโปรเจกต์ Call Service New Equipment ที่ Deploy เวอร์ชันล่าสุดแล้ว
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxCUVlyFOdXM1jW5dr6i2Zxh7fUPMc0vqLarVhIsyYS7FMNvQ1dzaZLqP-B9QQILcHQ/exec';

    // เติมค่าจาก URL Query Parameters อัตโนมัติ (ถ้ามีส่งมาทางลิงก์)
    const urlParams = new URLSearchParams(window.location.search);
    ['hospital', 'equipment', 'serialNumber', 'ibdate', 'expirydate'].forEach((key) => {
      const val = urlParams.get(key);
      if (val) {
        const el = document.getElementById(key);
        if (el) el.value = val;
      }
    });

    // ตั้งค่าให้ฟิลด์วันที่เป็นวันปัจจุบันโดยค่าเริ่มต้น
    document.getElementById('reportDate').valueAsDate = new Date();

    function handleFormSubmit(event) {
      event.preventDefault();
      
      // แสดงหน้า Loading
      document.getElementById('loadingOverlay').style.display = 'flex';

      const fileInput = document.getElementById('imageFile');
      const file = fileInput.files[0];

      const formData = {
        hospital: document.getElementById('hospital').value,
        contactName: document.getElementById('contactName').value,
        contactPhone: document.getElementById('contactPhone').value,
        equipment: document.getElementById('equipment').value,
        serialNumber: document.getElementById('serialNumber').value,
        ibdate: document.getElementById('ibdate').value,
        expirydate: document.getElementById('expirydate').value,
        problem: document.getElementById('problem').value,
        reportDate: document.getElementById('reportDate').value,
        engineer: document.getElementById('engineer').value,
        imageFile: null
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const data = e.target.result.split(',')[1];
          formData.imageFile = {
            name: file.name,
            type: file.type,
            data: data
          };
          sendToVercelApi(formData);
        };
        reader.readAsDataURL(file);
      } else {
        sendToVercelApi(formData);
      }
    }

    function sendToVercelApi(formData) {
      fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(formData)
      })
      .then(function(res) { return res.json(); })
      .then(function(response) {
        document.getElementById('loadingOverlay').style.display = 'none';
        if (response.status === 'success') {
          Swal.fire({
            icon: 'success',
            title: 'สำเร็จ!',
            text: response.message,
            confirmButtonColor: '#0d6efd'
          }).then(() => {
            document.getElementById('repairForm').reset();
            document.getElementById('reportDate').valueAsDate = new Date();
          });
        } else {
          Swal.fire({
            icon: 'error',
            title: 'เกิดข้อผิดพลาด',
            text: response.message,
            confirmButtonColor: '#d33'
          });
        }
      })
      .catch(function() {
        document.getElementById('loadingOverlay').style.display = 'none';
        Swal.fire({
          icon: 'error',
          title: 'เชื่อมต่อล้มเหลว',
          text: 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง',
          confirmButtonColor: '#d33'
        });
      });
    }
  </script>
</body>
</html>
